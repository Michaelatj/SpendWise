services:
  # -------------------------------------------------------------------
  # Database Service: MySQL 8.0 Container
  # -------------------------------------------------------------------
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: spendwise-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: spendwise
      MYSQL_USER: spendwise_user
      MYSQL_PASSWORD: spendwise_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------
  # Backend API Service: Node.js Express Container
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendwise-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: spendwise
    depends_on:
      database:
        condition: service_healthy

  # -------------------------------------------------------------------
  # Frontend Web Service: React SPA + Nginx Container
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spendwise-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

# Persistent Volumes
volumes:
  db_data:
