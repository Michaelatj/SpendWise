
name: SpendWise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. LINT BACKEND & FRONTEND
  # ==========================================
  lint:
    name: Lint ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Backend
            directory: backend
          - name: Frontend
            directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.directory }}
        run: npm run lint

  # ==========================================
  # 2. BUILD FRONTEND
  # ==========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  # ==========================================
  # 3. VERIFY BACKEND
  # ==========================================
  verify-backend:
    name: Verify Backend Syntax
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Check JavaScript Syntax
        shell: bash
        run: |
          find backend/src -type f -name "*.js" -print0 \
            | xargs -0 -r -n1 node --check

  # ==========================================
  # 4. VERIFY DOCKER BUILDS
  # ==========================================
  docker-build-check:
    name: Docker Build Check - ${{ matrix.name }}
    runs-on: ubuntu-latest

    needs:
      - build-frontend
      - verify-backend

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Database
            context: ./database
            dockerfile: ./database/Dockerfile
            image: spendwise-db

          - name: Backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: spendwise-backend

          - name: Frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: spendwise-frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:test
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ==========================================
  # 5. PUBLISH TO DOCKER HUB
  # ==========================================
  deploy:
    name: Publish Images to Docker Hub
    runs-on: ubuntu-latest

    needs:
      - docker-build-check

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Database Image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: |
            michaelandreastj/spendwise-db:latest
            michaelandreastj/spendwise-db:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=database
          cache-to: type=gha,mode=max,scope=database

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            michaelandreastj/spendwise-backend:latest
            michaelandreastj/spendwise-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            michaelandreastj/spendwise-frontend:latest
            michaelandreastj/spendwise-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publish Deployment Summary
        shell: bash
        run: |
          echo "### SpendWise CI/CD Published Successfully!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Registry: Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- michaelandreastj/spendwise-db:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- michaelandreastj/spendwise-backend:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- michaelandreastj/spendwise-frontend:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
