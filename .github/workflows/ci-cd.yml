name: SpendWise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =============================================================
  # STAGE 1: Code Linting & Static Analysis (Quality Gate)
  # =============================================================
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dir: backend
          - name: frontend
            dir: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install Dependencies (${{ matrix.name }})
        run: npm --prefix ${{ matrix.dir }} ci

      - name: Run ESLint (${{ matrix.name }})
        run: npm --prefix ${{ matrix.dir }} run lint

  # =============================================================
  # STAGE 2: Build & Verification
  # =============================================================
  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Frontend Production Bundle
        run: npm --prefix frontend run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  verify-backend:
    name: Verify Backend Code
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Validate Backend JavaScript Syntax
        run: find backend/src -name "*.js" -exec node --check {} +

  # =============================================================
  # STAGE 3: Docker Build Verification
  # =============================================================
  docker-build-check:
    name: Docker Build Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [build-frontend, verify-backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: database
            context: ./database
            dockerfile: ./database/Dockerfile
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: spendwise-${{ matrix.name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================
  # STAGE 4: Continuous Deployment / Release (Push to GHCR)
  # =============================================================
  deploy:
    name: Deploy & Publish Container Images
    runs-on: ubuntu-latest
    needs: [docker-build-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name for GHCR
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Database Image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/database:latest
            ghcr.io/${{ env.REPO_LOWER }}/database:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Deployment Summary
        run: |
          echo "### 🚀 SpendWise CI/CD Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published Docker Images to GitHub Container Registry (GHCR):" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.REPO_LOWER }}/database:latest\` (\`${{ github.sha }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.REPO_LOWER }}/backend:latest\` (\`${{ github.sha }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.REPO_LOWER }}/frontend:latest\` (\`${{ github.sha }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by commit: \`${{ github.sha }}\` on \`${{ github.ref }}\` by @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
